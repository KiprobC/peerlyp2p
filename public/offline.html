<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline · Peerly</title>
    <meta name="theme-color" content="#0B0F19" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        background: #0B0F19; color: #E2E8F0;
      }
      .wrap {
        min-height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .logo {
        width: 96px; height: 96px; border-radius: 24px;
        margin-bottom: 24px; overflow: hidden;
        box-shadow: 0 10px 40px rgba(33,150,243,.35);
        background: #0B0F19;
      }
      .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; }
      p  { color: #94A3B8; margin: 0 0 24px; max-width: 360px; line-height: 1.5; font-size: 15px; }
      button {
        background: #2196f3; color: #fff; border: 0; border-radius: 12px;
        padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
        transition: background .15s ease;
      }
      button:hover { background: #1d87da; }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .diag {
        margin-top: 28px; padding: 14px 18px; border-radius: 12px;
        background: rgba(148,163,184,.08); border: 1px solid rgba(148,163,184,.12);
        font-size: 13px; color: #94A3B8; min-width: 260px; text-align: left;
      }
      .diag .row { display: flex; justify-content: space-between; padding: 3px 0; }
      .diag .row b { color: #E2E8F0; font-weight: 500; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      .dot.ok { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,.6); }
      .dot.bad { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,.6); }
      .hint { margin-top: 18px; font-size: 12px; color: #64748B; max-width: 320px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><img src="/icons/icon-512.png" alt="Peerly" /></div>
      <h1>You're offline</h1>
      <p>Peerly needs an internet connection. Check your network and try again.</p>
      <button id="retry" onclick="retry()">Retry connection</button>
      <div class="diag" id="diag">
        <div class="row"><span>Network</span><b><span class="dot" id="netDot"></span><span id="netStatus">Checking…</span></b></div>
        <div class="row"><span>Peerly server</span><b><span class="dot" id="srvDot"></span><span id="srvStatus">Checking…</span></b></div>
        <div class="row"><span>Last check</span><b id="last">—</b></div>
      </div>
      <div class="hint">Your trades and wallets are safe. They will reconnect automatically once you're back online.</div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      function setStatus(dotId, textId, ok, label) {
        $(dotId).className = 'dot ' + (ok ? 'ok' : 'bad');
        $(textId).textContent = label;
      }
      async function diagnose() {
        const online = navigator.onLine;
        setStatus('netDot','netStatus', online, online ? 'Connected' : 'Offline');
        let srv = false;
        try {
          const r = await fetch('/manifest.webmanifest', { cache: 'no-store' });
          srv = r.ok;
        } catch {}
        setStatus('srvDot','srvStatus', srv, srv ? 'Reachable' : 'Unreachable');
        $('last').textContent = new Date().toLocaleTimeString();
        if (srv && online) location.reload();
      }
      function retry() {
        const btn = $('retry'); btn.disabled = true; btn.textContent = 'Checking…';
        diagnose().finally(() => { setTimeout(() => { btn.disabled = false; btn.textContent = 'Retry connection'; }, 800); });
      }
      window.addEventListener('online', diagnose);
      diagnose();
      setInterval(diagnose, 15000);
    </script>
  </body>
</html>
