<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline · Peerly</title>
    <meta name="theme-color" content="#0B0F19" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        background: #0B0F19; color: #E2E8F0;
      }
      .wrap {
        min-height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .logo {
        width: 88px; height: 88px; border-radius: 22px;
        background: #2196f3; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 44px; color: #fff; margin-bottom: 24px;
        box-shadow: 0 10px 40px rgba(33,150,243,.35);
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p  { color: #94A3B8; margin: 0 0 24px; max-width: 360px; line-height: 1.5; }
      button {
        background: #2196f3; color: #fff; border: 0; border-radius: 12px;
        padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #1d87da; }
      .hint { margin-top: 18px; font-size: 12px; color: #64748B; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">P</div>
      <h1>You're offline</h1>
      <p>Peerly needs an internet connection. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
      <div class="hint">Your trades and wallets are safe. They will reconnect automatically.</div>
    </div>
  </body>
</html>
